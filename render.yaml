services:
  - type: web
    name: rvit-teamhub
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:render
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NITRO_PRESET
        value: node-server
      - key: NODE_ENV
        value: production
      - key: VITE_AUTH_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://zvcebipompkisahakzpw.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: rvit-teamhub
          property: host
